# Bitbucket Pipelines CI: runs the test suite on every push.
# Tests use a scripted fake LLM, so no API key is needed.
image: python:3.12-slim

pipelines:
  default:
    - step:
        name: Run tests
        caches:
          - pip
        script:
          - pip install -r requirements-dev.txt
          - python -m pytest
